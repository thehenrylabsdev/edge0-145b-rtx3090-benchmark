name: Problem or correction
description: A script fails, a number looks wrong, or a claim is incorrect
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What is wrong
      description: Include the command, the log line or the source line that shows it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: false
