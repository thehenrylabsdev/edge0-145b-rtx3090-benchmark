name: New result
description: Share a run of this harness on your hardware
labels: ["result"]
body:
  - type: input
    id: gpu
    attributes:
      label: GPU and host
      description: GPU model, VRAM, CPU, RAM, PCIe generation and width, disk
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Engine and driver versions
      description: Contents of versions.txt, plus the driver/CUDA version
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Results
      description: Paste or attach results.csv and results/host/. B* and the config you found best.
    validations:
      required: true
  - type: textarea
    id: deviations
    attributes:
      label: Deviations from docs/methodology.md
      description: Anything you changed (windows, prompts, flags). Write "none" if nothing.
    validations:
      required: true
