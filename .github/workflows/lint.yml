name: lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: ruff (Python harness, chart builder)
        uses: astral-sh/ruff-action@v4
      - name: shellcheck (pod scripts)
        run: shellcheck scripts/*.sh
      - name: chart builder runs on the committed results
        run: python3 charts/build_charts.py
